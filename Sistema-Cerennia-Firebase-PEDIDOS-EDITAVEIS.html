function findCatalogProduct(name){const key=String(name||'').trim().toLocaleLowerCase('pt-BR');return productCatalog.find(p=>p.active!==false&&p.name.toLocaleLowerCase('pt-BR')===key)}

const todayISO=()=>{const d=new Date(),z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};

function loadDB(){return emptyDB()}
function saveDB(){scheduleCloudSave()}

async function loadCloudState(){const snap=await cloudStateRef.get();if(snap.exists){const data=snap.data()||{};db=data.db||emptyDB();productCatalog=Array.isArray(data.productCatalog)?data.productCatalog:loadProductCatalog()}else{await cloudStateRef.set({db,productCatalog,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}cloudReady=true}
function scheduleCloudSave(){if(!cloudReady||!firebaseAuth.currentUser)return;clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(async()=>{try{await cloudStateRef.set({db,productCatalog,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:firebaseAuth.currentUser.email},{merge:true})}catch(e){console.error(e);toast('Não foi possível salvar no Firebase.')}} ,250)}

// Ciclo de pedidos: quinta-feira até a quarta-feira seguinte.
function weekEnd(d){const x=new Date(d+'T12:00:00');const days=(3-x.getDay()+7)%7;x.setDate(x.getDate()+days);return x.toISOString().slice(0,10)}
function weekKey(d){const x=new Date(weekEnd(d)+'T12:00:00');x.setDate(x.getDate()-6);return x.toISOString().slice(0,10)}
function orderStatus(o){if(o.status==='Cancelado')return 'Cancelado';if(o.status==='Entregue')return 'Entregue';if(o.status==='Separado')return 'Separado';if(o.status==='Disponível para entrega')return 'Disponível para entrega';const end=weekEnd(o.date);return todayISO()>end?'Aguardando separação':'Pedido realizado'}
function sumItems(items){return (items||[]).reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.price)||0),0)}
function totalQty(o){return (o.items||[]).reduce((s,i)=>s+Number(i.qty||0),0)}
function statusClass(s){return ({'Entregue':'b-green','Separado':'b-blue','Disponível para entrega':'b-blue','Aguardando separação':'b-amber','Pedido realizado':'b-gray','Cancelado':'b-red','Pendente':'b-amber','Enviado para folha':'b-blue','Descontado':'b-green','Cancelado/Ajustado':'b-gray'})[s]||'b-gray'}
function badge(s){return `<span class="badge ${statusClass(s)}">${esc(s)}</span>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtTime(iso){return iso?new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(iso)):'—'}
function setPage(p){page=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('sidebar').classList.remove('open');render()}

function renderDashboard(el){const wk=weekKey(todayISO()),orders=db.orders.filter(o=>weekKey(o.date)===wk),delivered=orders.filter(o=>o.status==='Entregue'),todo=orders.filter(o=>!['Entregue','Cancelado','Separado','Disponível para entrega'].includes(orderStatus(o))),employees=new Set(orders.map(o=>o.employee.trim().toLowerCase())).size,weekSales=delivered.reduce((s,o)=>s+o.total,0),month=todayISO().slice(0,7),monthSales=db.orders.filter(o=>o.status==='Entregue'&&o.deliveryDate?.slice(0,7)===month).reduce((s,o)=>s+o.total,0),pending=db.orders.filter(o=>o.status==='Entregue'&&(!o.finStatus||o.finStatus==='Pendente')).reduce((s,o)=>s+o.total,0);
const months=Array.from({length:6},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));return d.toISOString().slice(0,7)}),monthly=months.map(m=>db.orders.filter(o=>o.status==='Entregue'&&o.deliveryDate?.slice(0,7)===m).reduce((s,o)=>s+o.total,0)),max=Math.max(1,...monthly);
const productCounts={};db.orders.filter(o=>o.status!=='Cancelado').forEach(o=>o.items.forEach(i=>productCounts[i.name]=(productCounts[i.name]||0)+Number(i.qty)));const top=Object.entries(productCounts).sort((a,b)=>b[1]-a[1]).slice(0,5),maxP=Math.max(1,...top.map(x=>x[1]));
const sectors={};db.orders.filter(o=>o.status==='Entregue').forEach(o=>sectors[o.sector||'Sem setor']=(sectors[o.sector||'Sem setor']||0)+o.total);const topS=Object.entries(sectors).sort((a,b)=>b[1]-a[1]).slice(0,5),maxS=Math.max(1,...topS.map(x=>x[1]));
el.innerHTML=head('Resumo operacional','Olá, Victor','Acompanhe pedidos, entregas e valores de desconto em folha.',`<button class="btn primary" onclick="openOrderModal()">＋ Novo pedido</button>`)+`<div class="stats">${stat('Pedidos desta semana',orders.length,'Pedidos registrados no ciclo atual','▤')}${stat('Funcionários com pedidos',employees,'Pessoas atendidas nesta semana','♙')}${stat('Pedidos para separar',todo.length,'Aguardando preparação','□')}${stat('Pedidos entregues',delivered.length,'Concluídos nesta semana','✓')}${stat('Valor vendido na semana',money(weekSales),'Pedidos entregues no ciclo atual','R$')}${stat('Valor vendido no mês',money(monthSales),'Entregas na competência atual','↗')}${stat('Pendente para desconto',money(pending),'Entregue e aguardando envio à folha','◷')}${stat('Itens pedidos',orders.filter(o=>o.status!=='Cancelado').reduce((s,o)=>s+totalQty(o),0),'Unidades nos pedidos da semana','▦')}</div>
<div class="grid2"><div class="card panel"><div class="panelhead"><h3>Vendas por mês</h3><span class="muted">Últimos seis meses</span></div><div class="barlist">${months.map((m,i)=>`<div class="barrow"><span>${monthName(m)}</span><div class="barbg"><div class="barfill" style="width:${Math.round(monthly[i]/max*100)}%"></div></div><span class="barval">${money(monthly[i])}</span></div>`).join('')}</div></div><div class="card panel"><div class="panelhead"><h3>Pedidos por status</h3><span class="muted">Base total</span></div><div class="donutwrap"><div class="donut"></div><div class="legend"><div class="leg"><span class="dot"></span>Entregues (${db.orders.filter(o=>o.status==='Entregue').length})</div><div class="leg"><span class="dot dot2"></span>Em separação (${db.orders.filter(o=>['Separado','Disponível para entrega'].includes(o.status)).length})</div><div class="leg"><span class="dot dot3"></span>Aguardando (${db.orders.filter(o=>!['Entregue','Cancelado','Separado','Disponível para entrega'].includes(orderStatus(o))).length})</div><div class="leg"><span class="dot dot4"></span>Cancelados (${db.orders.filter(o=>o.status==='Cancelado').length})</div></div></div></div></div>
<div class="grid2"><div class="card panel"><div class="panelhead"><h3>Produtos mais pedidos</h3><span class="muted">Unidades</span></div><div class="barlist">${top.length?top.map(([n,v])=>`<div class="barrow"><span>${esc(n)}</span><div class="barbg"><div class="barfill" style="width:${v/maxP*100}%"></div></div><span class="barval">${v}</span></div>`).join(''):'<div class="empty">Nenhum produto cadastrado</div>'}</div></div><div class="card panel"><div class="panelhead"><h3>Compras por setor</h3><span class="muted">Valor entregue</span></div><div class="barlist">${topS.length?topS.map(([n,v])=>`<div class="barrow"><span>${esc(n)}</span><div class="barbg"><div class="barfill" style="width:${v/maxS*100}%"></div></div><span class="barval">${money(v)}</span></div>`).join(''):'<div class="empty">Sem entregas registradas</div>'}</div></div></div>
<div class="card tablecard"><div class="tabletools"><strong style="font-size:13px">Pedidos recentes</strong><span style="margin-left:auto"></span><button class="btn small" onclick="setPage('orders')">Ver todos →</button></div>${ordersTable(db.orders.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,5),false)}</div>`}
function monthName(m){const [y,n]=m.split('-');return new Intl.DateTimeFormat('pt-BR',{month:'short'}).format(new Date(Number(y),Number(n)-1,1)).replace('.','')+'/'+y.slice(-2)}
function ordersTable(list,withActions=true){if(!list.length)return `<table class="table"><tbody><tr><td class="empty" colspan="7"><strong>Nenhum pedido encontrado</strong>Cadastre um pedido para começar.</td></tr></tbody></table>`;return `<div class="tablewrap"><table class="table"><thead><tr><th>Pedido</th><th>Funcionário</th><th>Produtos</th><th>Data</th><th>Total</th><th>Status</th>${withActions?'<th>Ações</th>':''}</tr></thead><tbody>${list.map(o=>`<tr><td><span class="strong">${esc(o.number)}</span><div class="subcell">${dateBR(o.date)}</div></td><td><span class="strong">${esc(o.employee)}</span><div class="subcell">${esc(o.sector||'—')}</div></td><td>${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join('<br>')}</td><td>${dateBR(o.date)}</td><td class="strong">${money(o.total)}</td><td>${badge(o.status==='Entregue'?o.status:orderStatus(o))}</td>${withActions?`<td><div class="actions"><button class="btn small" onclick="viewOrder('${o.id}')">Ver</button>${!['Entregue','Cancelado'].includes(o.status)?`<button class="btn small" onclick="openEditOrderModal('${o.id}')">Editar</button>`:''}${o.status!=='Entregue'?`<button class="btn small danger" onclick="deleteOrder('${o.id}')">Excluir</button>`:''}${o.status==='Entregue'?`<button class="btn small" onclick="showReceipt('${o.id}')">Recibo</button>`:''}</div></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function renderOrders(el){el.innerHTML=head('Administração','Pedidos de funcionários','Registre compras até quarta-feira. O valor é calculado por item automaticamente.',`<button class="btn primary" onclick="openOrderModal()">＋ Novo pedido</button>`)+`<div class="notice info">⏱ Pedidos da semana podem ser registrados até quarta-feira (${dateBR(weekEnd(todayISO()))}). Depois disso, ficam disponíveis para a equipe de separação.</div><div class="card tablecard"><div class="tabletools"><input class="search" id="orderSearch" placeholder="Pesquisar funcionário, produto ou pedido..." oninput="filterOrders()"><input type="date" class="filter" id="fromDate" onchange="filterOrders()"><input type="date" class="filter" id="toDate" onchange="filterOrders()"><select class="filter" id="orderStatusFilter" onchange="filterOrders()"><option value="">Todos os status</option><option>Pedido realizado</option><option>Aguardando separação</option><option>Separado</option><option>Disponível para entrega</option><option>Entregue</option><option>Cancelado</option></select><span class="muted" id="ordersCount" style="margin-left:auto"></span></div><div id="ordersTable">${ordersTable(db.orders.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)))}</div></div>`;filterOrders()}
function filterOrders(){const s=(document.getElementById('orderSearch')?.value||'').toLowerCase(),f=document.getElementById('fromDate')?.value||'',t=document.getElementById('toDate')?.value||'',st=document.getElementById('orderStatusFilter')?.value||'';const list=db.orders.filter(o=>(!s||[o.number,o.employee,o.sector,...o.items.map(i=>i.name)].join(' ').toLowerCase().includes(s))&&(!f||o.date>=f)&&(!t||o.date<=t)&&(!st||((o.status==='Entregue'||o.status==='Cancelado')?o.status:orderStatus(o))===st)).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));const dest=document.getElementById('ordersTable');if(dest)dest.innerHTML=ordersTable(list);const cnt=document.getElementById('ordersCount');if(cnt)cnt.textContent=`${list.length} pedido(s)`}
function renderSeparation(el){const ready=db.orders.filter(o=>!['Entregue','Cancelado'].includes(o.status)&&weekKey(o.date)<=weekKey(todayISO()));const pending=ready.filter(o=>!['Separado','Disponível para entrega'].includes(o.status));const gathered={};ready.filter(o=>o.status!=='Cancelado').forEach(o=>o.items.forEach(i=>gathered[i.name]=(gathered[i.name]||0)+Number(i.qty)));el.innerHTML=head('Operação','Separação e entrega','Consolide os produtos, marque pedidos separados e registre a entrega de sexta-feira.')+`<div class="notice info">Os pedidos são liberados para separação após quarta-feira. Para este protótipo, a liberação acompanha a data do ciclo, sem bloquear a equipe em outras datas.</div><div class="card panel sectiongap"><div class="panelhead"><h3>Consolidado de produtos</h3><span class="muted">${Object.keys(gathered).length} produto(s)</span></div><div class="productsummary">${Object.entries(gathered).map(([n,q])=>`<div class="productchip"><strong>${esc(n)}</strong><span>Quantidade total: <b>${q}</b></span></div>`).join('')||'<div class="muted">Sem itens para separar.</div>'}</div></div><div class="card tablecard sectiongap"><div class="tabletools"><strong style="font-size:13px">Pedidos para operação</strong><span style="margin-left:auto" class="muted">${pending.length} aguardando separação</span></div>${separationTable(ready)}</div>`}
function separationTable(list){if(!list.length)return `<table class="table"><tbody><tr><td class="empty" colspan="7"><strong>Nenhum pedido aguardando</strong>Quando os pedidos forem liberados, aparecerão aqui.</td></tr></tbody></table>`;return `<div class="tablewrap"><table class="table"><thead><tr><th>Pedido</th><th>Funcionário</th><th>Produtos e quantidades</th><th>Total</th><th>Status</th><th>Ação</th></tr></thead><tbody>${list.map(o=>`<tr><td class="strong">${esc(o.number)}<div class="subcell">${dateBR(o.date)}</div></td><td class="strong">${esc(o.employee)}<div class="subcell">${esc(o.sector||'—')}</div></td><td>${o.items.map(i=>`${esc(i.name)} — <b>${i.qty}</b>`).join('<br>')}</td><td class="strong">${money(o.total)}</td><td>${badge(o.status==='Entregue'?o.status:orderStatus(o))}</td><td>${o.status==='Entregue'?`<button class="btn small" onclick="showReceipt('${o.id}')">Recibo</button>`:o.status==='Cancelado'?badge('Cancelado'):['Separado','Disponível para entrega'].includes(o.status)?`<button class="btn small primary" onclick="confirmDelivery('${o.id}')">Confirmar entrega</button>`:`<button class="btn small primary" onclick="markSeparated('${o.id}')">Marcar separado</button>`}</td></tr>`).join('')}</tbody></table></div>`}
function markSeparated(id){const o=db.orders.find(x=>x.id===id);if(!o)return;o.status='Separado';o.separatedAt=new Date().toISOString();log('Pedido separado',o,'Status alterado para Separado');persistence.save();toast('Pedido marcado como separado.');render()}

function renderProducts(el){const active=productCatalog.filter(p=>p.active!==false).length;el.innerHTML=head('Cadastro','Produtos','Edite os produtos e preços Pct. Alterações no catálogo valem para novos pedidos.',`<button class="btn primary" onclick="openProductModal()">＋ Novo produto</button>`)+`<div class="stats">${stat('Produtos ativos',active,'Disponíveis para novos pedidos','▧')}${stat('Produtos inativos',productCatalog.length-active,'Preservados no cadastro','◷')}${stat('Tabela de referência','01/03/2026','Preço importado da coluna Pct','R$')}${stat('Preço aplicado','Por pacote','Congelado no pedido entregue','✓')}</div><div class="card tablecard"><div class="tabletools"><input class="search" id="catalogSearch" placeholder="Pesquisar produto..." oninput="filterCatalog()"><select class="filter" id="catalogState" onchange="filterCatalog()"><option value="active">Ativos</option><option value="inactive">Inativos</option><option value="all">Todos</option></select><span class="muted" id="catalogCount" style="margin-left:auto"></span></div><div id="catalogTable">${catalogTable(productCatalog.filter(p=>p.active!==false))}</div></div><p class="footnote">Os valores iniciais foram transcritos da coluna “Pct” do catálogo enviado. Produtos desativados permanecem no cadastro e não aparecem em novos pedidos.</p>`;filterCatalog()}
function catalogTable(list){if(!list.length)return `<table class="table"><tbody><tr><td colspan="4" class="empty"><strong>Nenhum produto encontrado</strong>Adicione um produto ou ajuste a busca.</td></tr></tbody></table>`;return `<div class="tablewrap"><table class="table"><thead><tr><th>Produto</th><th>Preço Pct</th><th>Situação</th><th>Ações</th></tr></thead><tbody>${list.map(p=>`<tr><td class="strong">${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.active===false?badge('Inativo'):badge('Ativo')}</td><td><div class="actions"><button class="btn small" onclick="openProductModal('${esc(p.id)}')">Editar</button><button class="btn small ${p.active===false?'':'danger'}" onclick="toggleProduct('${esc(p.id)}')">${p.active===false?'Reativar':'Desativar'}</button></div></td></tr>`).join('')}</tbody></table></div>`}
function filterCatalog(){const q=(document.getElementById('catalogSearch')?.value||'').toLocaleLowerCase('pt-BR'),state=document.getElementById('catalogState')?.value||'active';const list=productCatalog.filter(p=>(state==='all'||(state==='active'?p.active!==false:p.active===false))&&(!q||p.name.toLocaleLowerCase('pt-BR').includes(q)));const table=document.getElementById('catalogTable');if(table)table.innerHTML=catalogTable(list);const count=document.getElementById('catalogCount');if(count)count.textContent=`${list.length} produto(s)`}
function openProductModal(id=null){const p=id?productCatalog.find(x=>x.id===id):null;openModal(`<div class="modalhead"><h2>${p?'Editar produto':'Cadastrar produto'}</h2><button class="xbtn" onclick="closeModal()">×</button></div><form id="productForm"><div class="modalbody"><div class="notice info">O preço abaixo corresponde ao valor por pacote (coluna “Pct”). Nos pedidos já registrados, o valor original continua preservado.</div><div class="formgrid"><div class="field full"><label>Nome do produto *</label><input required name="name" value="${esc(p?.name||'')}" placeholder="Nome do produto"></div><div class="field"><label>Preço unitário — Pct (R$) *</label><input required type="number" min="0.01" step="0.01" name="price" value="${p?Number(p.price).toFixed(2):''}" placeholder="Ex.: 43,20"></div></div></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">${p?'Salvar alterações':'Cadastrar produto'}</button></div></form>`);document.getElementById('productForm').onsubmit=e=>saveProduct(e,id)}
function saveProduct(e,id){e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),price=Number(f.get('price'));if(!name||price<=0){toast('Informe o nome e um preço válido.');return}const dup=productCatalog.find(p=>p.id!==id&&p.name.trim().toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR'));if(dup){toast('Já existe um produto com esse nome.');return}const existing=id?productCatalog.find(p=>p.id===id):null;const before=existing?`${existing.name} · ${money(existing.price)}`:null;if(existing){existing.name=name;existing.price=price;existing.active=true}else productCatalog.push({id:uid(),name,price,active:true});saveProductCatalog();db.audit.unshift({id:uid(),action:existing?'Produto editado':'Produto cadastrado',orderNo:'—',detail:existing?`${before} → ${name} · ${money(price)}`:`${name} · ${money(price)}`,user:'Administrador',at:new Date().toISOString()});saveDB();closeModal();toast(existing?'Produto atualizado.':'Produto cadastrado.');render()}
function toggleProduct(id){const p=productCatalog.find(x=>x.id===id);if(!p)return;p.active=p.active===false;saveProductCatalog();db.audit.unshift({id:uid(),action:p.active?'Produto reativado':'Produto desativado',orderNo:'—',detail:`${p.name} · ${money(p.price)}`,user:'Administrador',at:new Date().toISOString()});saveDB();toast(p.active?'Produto reativado.':'Produto desativado.');render()}

function renderFinance(el){const delivered=db.orders.filter(o=>o.status==='Entregue'&&o.deliveryDate?.slice(0,7)===financeMonth&&o.finStatus!=='Cancelado/Ajustado');const groups={};delivered.forEach(o=>{const k=o.employee.trim().toLowerCase();if(!groups[k])groups[k]={employee:o.employee,sector:o.sector,orders:[],total:0,items:{},statuses:[]};const g=groups[k];g.orders.push(o);g.total+=o.total;g.statuses.push(o.finStatus||'Pendente');o.items.forEach(i=>g.items[i.name]=(g.items[i.name]||0)+Number(i.qty))});const rows=Object.values(groups).sort((a,b)=>a.employee.localeCompare(b.employee));const total=delivered.reduce((s,o)=>s+o.total,0),distinct=new Set(delivered.map(o=>o.id)).size,closed=db.closures.find(c=>c.month===financeMonth);
el.innerHTML=head('Financeiro','Desconto em folha','Consolide somente compras entregues. Pedidos cancelados não entram no cálculo.',`<button class="btn" onclick="exportFinanceCSV()">⇩ Exportar CSV</button><button class="btn" onclick="printFinance()">▧ PDF / Imprimir</button>`)+`<div class="card panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><div class="eyebrow" style="margin:0 0 5px">Competência</div><strong>${monthLabel(financeMonth)}</strong></div><input class="filter" type="month" value="${financeMonth}" onchange="financeMonth=this.value;render()"></div><div class="summaryline" style="margin-top:18px"><span>Funcionários<br><strong>${rows.length}</strong></span><span>Pedidos entregues<br><strong>${distinct}</strong></span><span>Compras entregues<br><strong>${money(total)}</strong></span><span>Valor para desconto<br><strong>${money(total)}</strong></span><span>Fechamento<br><strong>${closed?'Fechado':'Aberto'}</strong></span></div></div><div class="card tablecard sectiongap"><div class="tabletools"><strong style="font-size:13px">Consolidação por funcionário</strong>${closed?badge('Competência fechada'):`<button class="btn primary small" style="margin-left:auto" onclick="closeCompetence()">Fechar competência</button>`}</div>${financeTable(rows)}</div><p class="footnote">A competência considera a data efetiva da entrega. O fechamento registra um retrato dos valores e pedidos no momento do fechamento; o navegador local não substitui o controle contábil oficial.</p>`}
function financeTable(rows){if(!rows.length)return `<table class="table"><tbody><tr><td colspan="7" class="empty"><strong>Nenhuma compra entregue nesta competência</strong>Somente pedidos entregues entram no financeiro.</td></tr></tbody></table>`;return `<div class="tablewrap"><table class="table"><thead><tr><th>Funcionário / setor</th><th>Produtos</th><th>Pedidos</th><th>Valor total</th><th>Situação financeira</th><th>Ações</th></tr></thead><tbody>${rows.map(g=>{const states=[...new Set(g.statuses)],st=states.length===1?states[0]:'Pendente';return `<tr><td><span class="strong">${esc(g.employee)}</span><div class="subcell">${esc(g.sector||'—')}</div></td><td>${Object.entries(g.items).map(([n,q])=>`${esc(n)} (${q})`).join('<br>')}</td><td>${g.orders.length}</td><td class="strong">${money(g.total)}</td><td>${badge(st)}</td><td><select class="filter" onchange="setFinancialStatus('${g.orders.map(o=>o.id).join(',')}',this.value)" ${db.closures.some(c=>c.month===financeMonth)?'disabled':''}><option ${st==='Pendente'?'selected':''}>Pendente</option><option ${st==='Enviado para folha'?'selected':''}>Enviado para folha</option><option ${st==='Descontado'?'selected':''}>Descontado</option><option>Cancelado/Ajustado</option></select></td></tr>`}).join('')}</tbody></table></div>`}
function setFinancialStatus(ids,status){const orders=ids.split(',').map(id=>db.orders.find(o=>o.id===id)).filter(Boolean);orders.forEach(o=>{o.finStatus=status;log('Status financeiro atualizado',o,`Status alterado para ${status}`,'Financeiro')});persistence.save();toast('Situação financeira atualizada.');render()}
function closeCompetence(){const orders=db.orders.filter(o=>o.status==='Entregue'&&o.deliveryDate?.slice(0,7)===financeMonth&&o.finStatus!=='Cancelado/Ajustado');if(!orders.length){toast('Não há pedidos entregues para fechar.');return}const total=orders.reduce((s,o)=>s+o.total,0),employees=new Set(orders.map(o=>o.employee.trim().toLowerCase())).size;if(!confirm(`Fechar ${monthLabel(financeMonth)}?\n\nFuncionários: ${employees}\nPedidos: ${orders.length}\nTotal para desconto: ${money(total)}\n\nApós fechar, a competência ficará bloqueada nesta demonstração.`))return;const c={id:uid(),month:financeMonth,closedAt:new Date().toISOString(),orders:orders.map(o=>o.id),total,employees};db.closures.push(c);log('Competência fechada',null,`${monthLabel(financeMonth)} · ${orders.length} pedidos · ${money(total)}`,'Financeiro');persistence.save();toast('Competência fechada com sucesso.');render()}
function renderReports(el){const list=filteredReportOrders();el.innerHTML=head('Análise','Relatórios','Filtre o histórico e exporte os dados para conferência.',`<button class="btn" onclick="exportReportCSV()">⇩ Exportar CSV</button><button class="btn" onclick="printReport()">▧ PDF / Imprimir</button>`)+`<div class="card panel"><div class="filters"><input class="filter" id="rfEmployee" placeholder="Funcionário" value="${esc(reportFilters.employee||'')}" oninput="updateReports()"><input class="filter" id="rfSector" placeholder="Setor" value="${esc(reportFilters.sector||'')}" oninput="updateReports()"><input class="filter" id="rfProduct" placeholder="Produto" value="${esc(reportFilters.product||'')}" oninput="updateReports()"><input class="filter" id="rfFrom" type="date" value="${reportFilters.from||''}" onchange="updateReports()"><input class="filter" id="rfTo" type="date" value="${reportFilters.to||''}" onchange="updateReports()"><select class="filter" id="rfStatus" onchange="updateReports()"><option value="">Todos os status</option>${['Pedido realizado','Aguardando separação','Separado','Disponível para entrega','Entregue','Cancelado'].map(s=>`<option ${reportFilters.status===s?'selected':''}>${s}</option>`).join('')}</select><select class="filter" id="rfFin" onchange="updateReports()"><option value="">Todos financeiros</option>${['Pendente','Enviado para folha','Descontado','Cancelado/Ajustado'].map(s=>`<option ${reportFilters.fin===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="summaryline" style="margin-top:17px"><span>Pedidos encontrados<br><strong id="reportCount">${list.length}</strong></span><span>Valor total<br><strong id="reportTotal">${money(list.filter(o=>o.status!=='Cancelado').reduce((s,o)=>s+o.total,0))}</strong></span><span>Unidades<br><strong id="reportQty">${list.reduce((s,o)=>s+totalQty(o),0)}</strong></span></div></div><div class="card tablecard sectiongap" id="reportTable">${ordersTable(list)}</div>`}
function filteredReportOrders(){const f=reportFilters;return db.orders.filter(o=>(!f.employee||o.employee.toLowerCase().includes(f.employee.toLowerCase()))&&(!f.sector||(o.sector||'').toLowerCase().includes(f.sector.toLowerCase()))&&(!f.product||o.items.some(i=>i.name.toLowerCase().includes(f.product.toLowerCase())))&&(!f.from||o.date>=f.from)&&(!f.to||o.date<=f.to)&&(!f.status||((o.status==='Entregue'||o.status==='Cancelado')?o.status:orderStatus(o))===f.status)&&(!f.fin||o.finStatus===f.fin))}
function updateReports(){reportFilters={employee:document.getElementById('rfEmployee').value,sector:document.getElementById('rfSector').value,product:document.getElementById('rfProduct').value,from:document.getElementById('rfFrom').value,to:document.getElementById('rfTo').value,status:document.getElementById('rfStatus').value,fin:document.getElementById('rfFin').value};const list=filteredReportOrders();document.getElementById('reportCount').textContent=list.length;document.getElementById('reportTotal').textContent=money(list.filter(o=>o.status!=='Cancelado').reduce((s,o)=>s+o.total,0));document.getElementById('reportQty').textContent=list.reduce((s,o)=>s+totalQty(o),0);document.getElementById('reportTable').innerHTML=ordersTable(list)}
function renderHistory(el){el.innerHTML=head('Rastreabilidade','Histórico e auditoria','Consulte compras armazenadas, entregas e alterações registradas.')+`<div class="notice">Os registros ficam preservados no armazenamento local deste navegador. Para uso simultâneo por administrador, separação e financeiro, conecte este protótipo a um servidor e banco de dados com autenticação e cópias de segurança.</div><div class="tabs"><button class="tab active" onclick="historyTab('orders',this)">Pedidos (${db.orders.length})</button><button class="tab" onclick="historyTab('audit',this)">Log de auditoria (${db.audit.length})</button><button class="tab" onclick="historyTab('closures',this)">Fechamentos (${db.closures.length})</button></div><div id="historybody">${ordersTable(db.orders.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)))}</div><div class="actions sectiongap"><button class="btn" onclick="backupJSON()">⇩ Baixar backup completo (JSON)</button><button class="btn danger" onclick="openResetModal()">Limpar cadastros e histórico</button></div>`}
function openResetModal(){openModal(`<div class="modalhead"><h2>Limpar cadastros e histórico?</h2><button class="xbtn" onclick="closeModal()">×</button></div><div class="modalbody"><div class="notice">Esta ação remove permanentemente os pedidos, recibos, lançamentos financeiros, fechamentos e logs de pedidos salvos neste navegador. O catálogo de produtos, a logo e o login serão mantidos. Essa limpeza não poderá ser desfeita.</div><div class="field"><label>Para confirmar, digite ZERAR</label><input id="resetConfirmation" autocomplete="off" placeholder="ZERAR"></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn danger" id="resetConfirmButton" disabled onclick="confirmResetData()">Apagar dados</button></div>`);const input=document.getElementById('resetConfirmation'),button=document.getElementById('resetConfirmButton');input.addEventListener('input',()=>button.disabled=input.value.trim().toLocaleUpperCase('pt-BR')!=='ZERAR')}
function confirmResetData(){if(document.getElementById('resetConfirmation')?.value.trim().toLocaleUpperCase('pt-BR')!=='ZERAR')return;const productAudit=db.audit.filter(a=>String(a.action||'').startsWith('Produto '));db.orders=[];db.audit=productAudit;db.closures=[];db.seq={order:0,receipt:0};saveDB();closeModal();toast('Pedidos, recibos e histórico operacional foram limpos.');render()}
function historyTab(which,btn){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const b=document.getElementById('historybody');if(which==='orders')b.innerHTML=ordersTable(db.orders.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)));else if(which==='audit')b.innerHTML=auditTable();else b.innerHTML=closureTable()}
function auditTable(){return `<div class="card tablecard"><div class="tablewrap"><table class="table"><thead><tr><th>Data e hora</th><th>Usuário</th><th>Ação</th><th>Referência / detalhe</th></tr></thead><tbody>${db.audit.length?db.audit.map(a=>`<tr><td>${fmtTime(a.at)}</td><td>${esc(a.user)}</td><td class="strong">${esc(a.action)}</td><td>${esc(a.orderNo)}<div class="subcell">${esc(a.detail)}</div></td></tr>`).join(''):'<tr><td colspan="4" class="empty">Nenhuma alteração registrada.</td></tr>'}</tbody></table></div></div>`}
function closureTable(){return `<div class="card tablecard"><div class="tablewrap"><table class="table"><thead><tr><th>Competência</th><th>Fechado em</th><th>Funcionários</th><th>Pedidos</th><th>Total</th></tr></thead><tbody>${db.closures.length?db.closures.slice().reverse().map(c=>`<tr><td class="strong">${monthLabel(c.month)}</td><td>${fmtTime(c.closedAt)}</td><td>${c.employees}</td><td>${c.orders.length}</td><td class="strong">${money(c.total)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Nenhuma competência fechada.</td></tr>'}</tbody></table></div></div>`}
function monthLabel(m){if(!m)return'—';const [y,n]=m.split('-');return new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(+y,+n-1,1))}
function openOrderModal(){if(todayISO()>weekEnd(todayISO())){toast('Prazo de pedidos desta semana encerrado na quarta-feira.');return}openModal(`<div class="modalhead"><h2>Novo pedido de funcionário</h2><button class="xbtn" onclick="closeModal()">×</button></div><form id="orderForm"><div class="modalbody"><div class="formgrid"><div class="field"><label>Nome completo do funcionário *</label><input required name="employee" placeholder="Ex.: João da Silva"></div><div class="field"><label>Setor / departamento</label><input name="sector" placeholder="Ex.: Produção"></div><div class="field"><label>Data do pedido *</label><input required type="date" name="date" value="${todayISO()}" max="${weekEnd(todayISO())}"></div><div class="field full"><label>Observações</label><textarea name="notes" placeholder="Informações adicionais, se necessário"></textarea></div></div><div class="itemshead"><strong>Produtos do pedido</strong><button type="button" class="btn small" onclick="addItemRow()">＋ Adicionar produto</button></div><datalist id="productCatalogOptions">${productCatalog.filter(p=>p.active!==false).map(p=>`<option value="${esc(p.name)}"></option>`).join('')}</datalist><div class="muted">Preço unitário preenchido pela coluna “Pct” do catálogo atualizado em 01/03/2026.</div><div id="itemrows"></div><div class="modaltotal"><span>Total do pedido</span><strong id="orderTotal">R$ 0,00</strong></div></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar pedido</button></div></form>`);addItemRow();document.getElementById('orderForm').onsubmit=saveOrder}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalback').classList.add('open')}
function closeModal(){document.getElementById('modalback').classList.remove('open')}
document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
function addItemRow(item=null){const wrap=document.getElementById('itemrows');const div=document.createElement('div');div.className='itemrow';div.innerHTML=`<input required placeholder="Digite ou selecione um produto" class="iname" list="productCatalogOptions" value="${esc(item?.name||'')}"><input required type="number" min="1" step="1" placeholder="Qtd." class="iqty" value="${item?.qty??''}"><input required type="number" min="0.01" step="0.01" placeholder="Preço Pct" class="iprice" title="Preço por pacote conforme a coluna Pct" value="${item?.price??''}"><span class="line-total">R$ 0,00</span><button type="button" class="removeitem" title="Remover">×</button>`;div.querySelector('.iname').addEventListener('input',()=>syncCatalogPrice(div));div.querySelectorAll('input').forEach(x=>x.addEventListener('input',recalcOrder));div.querySelector('.removeitem').onclick=()=>{if(document.querySelectorAll('.itemrow').length>1)div.remove();else toast('O pedido precisa ter ao menos um produto.');recalcOrder()};wrap.appendChild(div);if(item){const product=findCatalogProduct(item.name),price=div.querySelector('.iprice');if(product)price.readOnly=true;recalcOrder()}}
function syncCatalogPrice(row){const product=findCatalogProduct(row.querySelector('.iname').value),price=row.querySelector('.iprice');if(product){price.value=product.price.toFixed(2);price.readOnly=true}else price.readOnly=false;recalcOrder()}
function recalcOrder(){let total=0;document.querySelectorAll('.itemrow').forEach(r=>{const q=Number(r.querySelector('.iqty').value),p=Number(r.querySelector('.iprice').value),t=q*p;total+=t;r.querySelector('.line-total').textContent=money(t)});const el=document.getElementById('orderTotal');if(el)el.textContent=money(total)}
function saveOrder(e){e.preventDefault();const f=new FormData(e.target),items=[...document.querySelectorAll('.itemrow')].map(r=>({name:r.querySelector('.iname').value.trim(),qty:Number(r.querySelector('.iqty').value),price:Number(r.querySelector('.iprice').value)}));if(!f.get('employee').trim()||!items.length||items.some(i=>!i.name||i.qty<=0||i.price<=0)){toast('Preencha funcionário e produtos com quantidade e preço válidos.');return}const date=f.get('date');if(date>weekEnd(todayISO())){toast('A data precisa estar dentro do prazo desta semana.');return}const duplicate=db.orders.find(o=>o.employee.trim().toLowerCase()===f.get('employee').trim().toLowerCase()&&o.date===date&&o.status!=='Cancelado'&&o.items.map(i=>i.name.toLowerCase()).sort().join('|')===items.map(i=>i.name.toLowerCase()).sort().join('|'));if(duplicate&&!confirm(`Pode haver duplicidade com ${duplicate.number}. Deseja registrar outro pedido mesmo assim?`))return;const o={id:uid(),number:nextNumber('order'),receiptNo:null,employee:f.get('employee').trim(),sector:f.get('sector').trim(),items,total:sumItems(items),date,notes:f.get('notes').trim(),status:'Pedido realizado',finStatus:null,createdAt:new Date().toISOString(),deliveryDate:null,deliveredAt:null,deliveryBy:null,receivedBy:null,receipt:null};db.orders.unshift(o);log('Pedido criado',o,`${items.length} produto(s) · ${money(o.total)}`);persistence.save();closeModal();toast(`Pedido ${o.number} criado.`);render()}

function openEditOrderModal(id){const o=db.orders.find(x=>x.id===id);if(!o)return;if(['Entregue','Cancelado'].includes(o.status)){toast('Este pedido não pode ser editado.');return}openModal(`<div class="modalhead"><h2>Editar pedido ${esc(o.number)}</h2><button class="xbtn" onclick="closeModal()">×</button></div><form id="editOrderForm"><div class="modalbody"><div class="notice info">As alterações serão salvas no Firebase e registradas no histórico de auditoria.</div><div class="formgrid"><div class="field"><label>Nome completo do funcionário *</label><input required name="employee" value="${esc(o.employee)}"></div><div class="field"><label>Setor / departamento</label><input name="sector" value="${esc(o.sector||'')}"></div><div class="field"><label>Data do pedido *</label><input required type="date" name="date" value="${o.date}"></div><div class="field full"><label>Observações</label><textarea name="notes">${esc(o.notes||'')}</textarea></div></div><div class="itemshead"><strong>Produtos do pedido</strong><button type="button" class="btn small" onclick="addItemRow()">＋ Adicionar produto</button></div><datalist id="productCatalogOptions">${productCatalog.filter(p=>p.active!==false).map(p=>`<option value="${esc(p.name)}"></option>`).join('')}</datalist><div id="itemrows"></div><div class="modaltotal"><span>Total do pedido</span><strong id="orderTotal">${money(o.total)}</strong></div></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar alterações</button></div></form>`);o.items.forEach(i=>addItemRow(i));document.getElementById('editOrderForm').onsubmit=e=>saveEditedOrder(e,id)}

function saveEditedOrder(e,id){e.preventDefault();const o=db.orders.find(x=>x.id===id);if(!o||['Entregue','Cancelado'].includes(o.status)){toast('Este pedido não pode ser editado.');return}const f=new FormData(e.target),items=[...document.querySelectorAll('.itemrow')].map(r=>({name:r.querySelector('.iname').value.trim(),qty:Number(r.querySelector('.iqty').value),price:Number(r.querySelector('.iprice').value)}));if(!f.get('employee').trim()||!items.length||items.some(i=>!i.name||i.qty<=0||i.price<=0)){toast('Preencha funcionário e produtos com quantidade e preço válidos.');return}const oldTotal=o.total,oldEmployee=o.employee;o.employee=f.get('employee').trim();o.sector=f.get('sector').trim();o.date=f.get('date');o.notes=f.get('notes').trim();o.items=items;o.total=sumItems(items);o.updatedAt=new Date().toISOString();log('Pedido editado',o,`${oldEmployee} → ${o.employee} · ${money(oldTotal)} → ${money(o.total)}`);persistence.save();closeModal();toast(`Pedido ${o.number} atualizado.`);render()}

function deleteOrder(id){const o=db.orders.find(x=>x.id===id);if(!o)return;if(o.status==='Entregue'){toast('Pedido entregue não pode ser excluído.');return}if(!confirm(`Excluir definitivamente o pedido ${o.number} de ${o.employee}?\n\nEsta ação remove o pedido da lista e não poderá ser desfeita.`))return;log('Pedido excluído',o,`${o.employee} · ${o.items.length} produto(s) · ${money(o.total)}`);db.orders=db.orders.filter(x=>x.id!==id);persistence.save();closeModal();toast(`Pedido ${o.number} excluído.`);render()}

function viewOrder(id){const o=db.orders.find(x=>x.id===id);if(!o)return;openModal(`<div class="modalhead"><h2>Pedido ${esc(o.number)}</h2><button class="xbtn" onclick="closeModal()">×</button></div><div class="modalbody"><div class="formgrid"><div><span class="muted">Funcionário</span><div class="strong">${esc(o.employee)}</div></div><div><span class="muted">Setor</span><div class="strong">${esc(o.sector||'—')}</div></div><div><span class="muted">Pedido em</span><div class="strong">${dateBR(o.date)}</div></div></div><div class="sectiongap">${o.items.map(i=>`<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px"><span>${esc(i.name)} × ${i.qty}</span><span>${money(i.qty*i.price)}</span></div>`).join('')}</div><div class="modaltotal"><span>Total</span><strong>${money(o.total)}</strong></div><p>Status: ${badge(o.status==='Entregue'?o.status:orderStatus(o))}</p>${o.notes?`<p class="muted">Observações: ${esc(o.notes)}</p>`:''}${o.status==='Entregue'?`<p class="muted">Entregue em ${fmtTime(o.deliveredAt)} por ${esc(o.deliveryBy||'—')}</p>`:''}</div><div class="modalfoot">${o.status!=='Entregue'&&o.status!=='Cancelado'?`<button class="btn danger" onclick="cancelOrder('${o.id}')">Cancelar pedido</button>`:''}<button class="btn" onclick="closeModal()">Fechar</button></div>`)}
function cancelOrder(id){const o=db.orders.find(x=>x.id===id);if(!o||o.status==='Entregue'){toast('Pedido entregue não pode ser cancelado sem autorização administrativa.');return}if(!confirm(`Cancelar o pedido ${o.number}? O registro será mantido no histórico.`))return;o.status='Cancelado';log('Pedido cancelado',o,'Cancelado sem exclusão definitiva');persistence.save();closeModal();toast('Pedido cancelado e mantido no histórico.');render()}
function confirmDelivery(id){const o=db.orders.find(x=>x.id===id);if(!o||!['Separado','Disponível para entrega'].includes(o.status)){toast('Marque o pedido como separado antes de entregar.');return}openModal(`<div class="modalhead"><h2>Confirmar entrega · ${esc(o.number)}</h2><button class="xbtn" onclick="closeModal()">×</button></div><form id="deliveryForm"><div class="modalbody"><div class="notice info">Confirme os dados do recebimento. Ao concluir, o pedido será bloqueado para edição comum e o recibo ficará vinculado ao registro.</div><div class="formgrid"><div class="field"><label>Responsável pela entrega *</label><input required name="deliveryBy" placeholder="Nome de quem está entregando"></div><div class="field"><label>Funcionário que recebeu *</label><input required name="receivedBy" value="${esc(o.employee)}"></div><div class="field"><label>Data da entrega *</label><input required type="date" name="deliveryDate" value="${todayISO()}"></div><div class="field"><label>Horário</label><input type="time" name="deliveryTime" value="${new Date().toTimeString().slice(0,5)}"></div></div><div class="sectiongap"><b style="font-size:12px">Produtos entregues</b>${o.items.map(i=>`<div style="padding:9px 0;font-size:12px;border-bottom:1px solid var(--line)">${esc(i.name)} · ${i.qty} un. · ${money(i.price)} · ${money(i.qty*i.price)}</div>`).join('')}</div><div class="modaltotal"><span>Total do pedido</span><strong>${money(o.total)}</strong></div></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Voltar</button><button class="btn primary">Confirmar entrega e gerar recibo</button></div></form>`);document.getElementById('deliveryForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const dt=f.get('deliveryDate');if(dt<o.date){toast('A data da entrega não pode ser anterior ao pedido.');return}const deliveryTime=f.get('deliveryTime')||new Date().toTimeString().slice(0,5);const deliveredAt=new Date(`${dt}T${deliveryTime}:00`).toISOString();o.status='Entregue';o.deliveryDate=dt;o.deliveredAt=deliveredAt;o.deliveryBy=f.get('deliveryBy').trim();o.receivedBy=f.get('receivedBy').trim();o.finStatus='Pendente';o.receiptNo=nextNumber('receipt');o.receipt={number:o.receiptNo,orderNo:o.number,employee:o.employee,sector:o.sector,orderDate:o.date,deliveryDate:dt,deliveredAt,deliveryBy:o.deliveryBy,receivedBy:o.receivedBy,items:o.items.map(i=>({...i})),total:o.total};log('Entrega confirmada',o,`Recebido por ${o.receivedBy} · ${money(o.total)}`,'Equipe de entrega');persistence.save();closeModal();toast('Entrega confirmada. Recibo gerado.');showReceipt(o.id)}}

function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function downloadCSV(name,rows){const csv='\ufeff'+rows.map(r=>r.map(csvEscape).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportFinanceCSV(){const orders=db.orders.filter(o=>o.status==='Entregue'&&o.deliveryDate?.slice(0,7)===financeMonth&&o.finStatus!=='Cancelado/Ajustado'),g={};orders.forEach(o=>{let k=o.employee.trim().toLowerCase();g[k]??={name:o.employee,items:{},total:0,status:o.finStatus||'Pendente',orders:[]};g[k].orders.push(o);o.items.forEach(i=>g[k].items[i.name]=(g[k].items[i.name]||0)+Number(i.qty));g[k].total+=o.total});downloadCSV(`fechamento_${financeMonth}.csv`,[['Funcionário','Setor','Produtos','Pedidos','Valor total','Situação'],...Object.values(g).map(x=>[x.name,x.orders[0]?.sector,Object.entries(x.items).map(([n,q])=>`${n} (${q})`).join(' / '),x.orders.length,x.total.toFixed(2),x.status])])}
function exportReportCSV(){const l=filteredReportOrders();downloadCSV('relatorio_pedidos.csv',[['Pedido','Recibo','Funcionário','Setor','Produtos','Data do pedido','Data da entrega','Status','Status financeiro','Total'],...l.map(o=>[o.number,o.receiptNo||'',o.employee,o.sector,o.items.map(i=>`${i.name} (${i.qty})`).join(' / '),o.date,o.deliveryDate||'',o.status,o.finStatus||'',o.total.toFixed(2)])])}
function printFinance(){const content=document.querySelector('.content').innerHTML;const w=window.open('','_blank');w.document.write(`<html><head><title>Fechamento ${monthLabel(financeMonth)}</title><style>body{font:12px Arial;padding:24px;color:#222}h1{font-size:20px}table{border-collapse:collapse;width:100%;margin-top:18px}th,td{border:1px solid #ddd;padding:9px;text-align:left}th{background:#eee}.btn,.actions,input,select{display:none!important}</style></head><body><h1>Fechamento financeiro · ${monthLabel(financeMonth)}</h1>${document.querySelector('.content .summaryline')?.outerHTML||''}${document.querySelector('.content .tablecard')?.innerHTML||''}</body></html>`);w.document.close();w.print()}
function printReport(){window.print()}
function backupJSON(){const blob=new Blob([JSON.stringify({...db,productCatalog},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup_pedidos_${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href)}
function firebaseErrorMessage(err){const code=err?.code||'';console.error('Firebase Auth:',code,err);if(code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found'))return 'E-mail ou senha incorretos.';if(code.includes('invalid-api-key'))return 'A chave do Firebase foi recusada. Abra este arquivo novo e não uma versão antiga salva no navegador.';if(code.includes('unauthorized-domain'))return 'Este endereço ainda não está autorizado no Firebase Authentication. Publique no Firebase Hosting para usar o endereço seguro do sistema.';if(code.includes('too-many-requests'))return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';if(code.includes('network-request-failed'))return 'Falha de conexão. Verifique sua internet.';return 'Erro de autenticação: '+(code||err?.message||'desconhecido');}
function renderAuth(error=''){document.body.classList.add('auth-lock');const screen=document.getElementById('authScreen');screen.innerHTML=`<div class="auth-screen"><section class="auth-visual"><div class="auth-brand"><img class="auth-company-logo" src="${document.querySelector('.company-logo')?.src||''}" alt="Cerênnia — Soluções em Panificação"><span class="auth-brand-caption">GESTÃO DE PEDIDOS</span></div><div class="auth-message"><div class="auth-kicker">CONTROLE SIMPLES E ORGANIZADO</div><h1>Pedidos, entregas e financeiro em um só lugar.</h1><p>Gerencie os produtos dos funcionários com acompanhamento claro, do pedido ao fechamento mensal.</p></div><div class="auth-foot">Acesso administrativo · ${new Date().getFullYear()}</div></section><section class="auth-panel"><div class="auth-box"><div class="auth-kicker">ÁREA ADMINISTRATIVA</div><h2>Bem-vindo de volta</h2><p>Entre com o e-mail e a senha cadastrados no Firebase.</p><form class="auth-form" id="authForm"><div class="auth-field"><label for="authEmail">E-mail</label><input id="authEmail" name="email" type="email" required autocomplete="username" placeholder="seuemail@empresa.com" autofocus></div><div class="auth-field"><label for="authPassword">Senha</label><input id="authPassword" name="password" type="password" required autocomplete="current-password" placeholder="Digite sua senha"></div>${error?`<div class="auth-error">${esc(error)}</div>`:''}<button class="auth-submit">Entrar no sistema</button></form><p class="auth-hint">Acesso protegido pelo Firebase Authentication. Os dados do sistema são sincronizados com o Cloud Firestore.<br><b>Versão Firebase: 05/10/2026 · revisão 2</b></p></div></section></div>`;document.getElementById('authForm').onsubmit=submitAuth}
async function submitAuth(e){e.preventDefault();const form=new FormData(e.currentTarget),email=String(form.get('email')||'').trim(),password=String(form.get('password')||'');const btn=e.currentTarget.querySelector('button');btn.disabled=true;btn.textContent='Entrando...';try{await firebaseAuth.signInWithEmailAndPassword(email,password)}catch(err){renderAuth(firebaseErrorMessage(err))}}
async function openApplication(user){try{await loadCloudState();document.body.classList.remove('auth-lock');document.getElementById('authScreen').innerHTML='';const label=document.getElementById('authUserLabel');if(label)label.textContent=user?.email||'Administrador';render()}catch(err){console.error(err);renderAuth('Login realizado, mas não foi possível carregar o banco de dados. Verifique as regras do Firestore e tente novamente.')}}
function initializeAuth(){firebaseAuth.onAuthStateChanged(user=>{if(user)openApplication(user);else renderAuth()})}
async function logout(){cloudReady=false;await firebaseAuth.signOut()}
async function changePassword(){const user=firebaseAuth.currentUser;if(!user)return;const next=prompt('Digite a nova senha (mínimo de 8 caracteres):');if(next===null)return;if(next.length<8){toast('A senha deve ter ao menos 8 caracteres.');return}try{await user.updatePassword(next);toast('Senha atualizada com sucesso.')}catch(err){toast('Por segurança, saia e entre novamente antes de alterar a senha.')}}
initializeAuth();
</script>
